apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: azurex-lockdown
  namespace: azurex
spec:
  podSelector:
    matchLabels:
      app: azurex
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              role: ingress
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: azurex-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: azurex-redis
      ports:
        - protocol: TCP
          port: 6379
